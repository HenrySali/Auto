<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6C3FE0">
<link rel="manifest" href="./manifest.json">
<title>Auto Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.hidden{display:none!important}
header{background:#6C3FE0;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(108,63,224,.3)}
header h1{font-size:1.1rem;font-weight:700}
header .user-info{font-size:.72rem;opacity:.85;margin-top:2px}
header button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:background .2s}
header button:hover{background:rgba(255,255,255,.3)}
.container{max-width:500px;margin:0 auto;padding:16px 14px;padding-bottom:85px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);border:1px solid #f0f0f0}
.btn{background:#6C3FE0;color:#fff;border:none;padding:11px 18px;border-radius:10px;cursor:pointer;font-size:.9rem;width:100%;font-weight:600;transition:background .2s}
.btn:hover{background:#5530B0}
.btn:disabled{opacity:.5}
.btn-outline{background:transparent;color:#6C3FE0;border:2px solid #6C3FE0;padding:11px 18px;border-radius:10px;cursor:pointer;font-size:.9rem;width:100%;font-weight:600;transition:all .2s}
.btn-outline:hover{background:#6C3FE0;color:#fff}
.btn-danger{background:#EF4444;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:.9rem;margin-bottom:8px;transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6C3FE0;box-shadow:0 0 0 3px rgba(108,63,224,.1)}
label{display:block;font-size:.78rem;font-weight:600;color:#555;margin-bottom:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:4px;background:#ececec;padding:4px;border-radius:10px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:.85rem;cursor:pointer;font-weight:600;color:#777;transition:all .2s}
.tab.active{background:#fff;color:#6C3FE0;box-shadow:0 2px 4px rgba(0,0,0,.08)}
</style>
</head>
<body>
<style>
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:flex-start;padding:6px 2px 8px;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.04);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:center;font-size:.6rem;color:#aaa;text-decoration:none;padding:4px 6px;border-radius:8px;transition:color .2s;white-space:nowrap}
nav a.active{color:#6C3FE0;font-weight:700}
nav a .icon{font-size:1.15rem;margin-bottom:1px}
.stat{text-align:center}
.stat .value{font-size:1.4rem;font-weight:800}
.stat .label-text{font-size:.7rem;color:#999;margin-top:2px}
.text-success{color:#10B981}
.text-danger{color:#EF4444}
.text-warning{color:#F59E0B}
.text-primary{color:#6C3FE0}
.text-sm{font-size:.82rem}
.text-xs{font-size:.72rem;color:#999}
.mb-2{margin-bottom:8px}
.mb-3{margin-bottom:14px}
.mt-2{margin-top:8px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.list-item{padding:11px 0;border-bottom:1px solid #f5f5f5}
.list-item:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:700}
.badge-green{background:#d1fae5;color:#065f46}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,rgba(108,63,224,.06) 0%,#fff 100%)}
.login-box{width:100%;max-width:380px}
.login-box h1{text-align:center;color:#6C3FE0;font-size:2rem;margin-bottom:6px}
.login-box .subtitle{text-align:center;color:#999;margin-bottom:28px;font-size:.9rem}
.error-msg{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:.82rem;text-align:center;margin-bottom:10px}
#token-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
#token-screen .card{max-width:380px;width:100%}
.progress-bar{background:#ececec;border-radius:6px;height:10px;overflow:hidden;margin:8px 0}
.progress-bar .fill{height:100%;border-radius:6px;transition:width .3s}
.section-title{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.backup-btn{display:flex;align-items:center;gap:12px;padding:14px;background:#f8f8f8;border:1.5px solid #e8e8e8;border-radius:12px;cursor:pointer;transition:all .2s;margin-bottom:10px}
.backup-btn:hover{border-color:#6C3FE0;background:#faf8ff}
.backup-btn .icon{font-size:1.6rem}
.backup-btn .text{font-size:.85rem;font-weight:600;color:#333}
.backup-btn .desc{font-size:.72rem;color:#999;margin-top:2px}
.arrow.open{transform:rotate(90deg)!important}
.vehicle-card{background:#fff;border:2px solid #e8e8e8;border-radius:16px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.vehicle-card:hover{border-color:#6C3FE0;box-shadow:0 4px 12px rgba(108,63,224,.12)}
.vehicle-card .patente{font-size:1.3rem;font-weight:800;color:#333;letter-spacing:1px}
.vehicle-card .conductor{font-size:.85rem;color:#666;margin-top:4px}
.vehicle-select-wrap{min-height:100vh;padding:20px;background:linear-gradient(135deg,rgba(108,63,224,.04) 0%,#f5f5f5 100%)}
.vehicle-select-wrap .header{text-align:center;margin-bottom:24px;padding-top:40px}
.vehicle-select-wrap .header h1{color:#6C3FE0;font-size:1.6rem;margin-bottom:4px}
.vehicle-select-wrap .header p{color:#999;font-size:.9rem}
.vehicle-select-container{max-width:440px;margin:0 auto}
</style>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
<div class="login-box">
<h1>🚗 Auto Manager</h1>
<p class="subtitle">Gestion de vehiculos</p>
<div class="card">
<div id="login-error" class="error-msg hidden"></div>
<form onsubmit="handleLogin(event);return false">
<label>Tu nombre</label>
<input id="login-nombre" type="text" placeholder="Nombre" required>
<label>Clave de acceso</label>
<input id="login-clave" type="password" placeholder="Clave" required>
<button class="btn" type="submit">Entrar</button>
</form>
</div>
</div>
</div>

<!-- TOKEN -->
<div id="token-screen" class="hidden">
<div class="card">
<h3 style="margin-bottom:10px;font-size:1.1rem">🔑 Configurar acceso</h3>
<p class="text-xs mb-3">Solo se hace una vez. Pega tu token de GitHub para guardar datos.</p>
<div id="token-error" class="error-msg hidden"></div>
<input id="setup-token" type="text" placeholder="ghp_... o github_pat_...">
<button class="btn" onclick="saveToken()">Guardar y continuar</button>
</div>
</div>

<!-- VEHICLE SELECT -->
<div id="vehicle-screen" class="hidden vehicle-select-wrap">
<div class="header">
<h1>🚗 Seleccionar Vehiculo</h1>
<p id="vehicle-user-info">-</p>
</div>
<div class="vehicle-select-container" id="vehicle-list"></div>
<div style="max-width:440px;margin:0 auto;padding-top:10px">
<button class="btn-outline" onclick="logout()" style="margin-top:10px">← Cerrar sesion</button>
</div>
</div>

<!-- APP -->
<div id="app-screen" class="hidden">
<header>
<div><h1>Auto Manager</h1><p class="user-info" id="header-user">-</p></div>
<div style="display:flex;gap:8px;align-items:center">
<button onclick="goToVehicleSelect()" style="font-size:.7rem;padding:5px 10px">🚗</button>
<button onclick="logout()">Salir</button>
</div>
</header>
<div class="container">
<div id="page-inicio"></div>
<div id="page-km" class="hidden"></div>
<div id="page-entregas" class="hidden"></div>
<div id="page-gastos" class="hidden"></div>
<div id="page-caja" class="hidden"></div>
<div id="page-ahorro" class="hidden"></div>
<div id="page-backup" class="hidden"></div>
<div id="page-notas" class="hidden"></div>
<div id="page-infracciones" class="hidden"></div>
<div id="page-usuarios" class="hidden"></div>
<div id="page-vehiculos" class="hidden"></div>
</div>
<nav id="main-nav"></nav>
</div>
<input type="file" id="restore-input" accept=".json" style="display:none" onchange="restoreDB(event)">
<script>
const REPO='HenrySali',REPO_NAME='Auto',DATA_PATH='data/db.json',RENTA=420000;
let ghToken=localStorage.getItem('gh_token')||'',currentUser=JSON.parse(localStorage.getItem('current_user')||'null');
let db={users:[],vehicles:[],km:[],deliveries:[],expenses:[],petty_cash:[],notes:[],savings:[],savings_goal:{target:0,title:'Meta de ahorro'}};
let currentPage='inicio',dashPeriod='week',dbSha=null;
let selectedVehicle=null;

// GitHub API
const GH={
  async get(path){
    const r=await fetch(`https://api.github.com/repos/${REPO}/${REPO_NAME}/contents/${path}`,{headers:{Authorization:`token ${ghToken}`,Accept:'application/vnd.github.v3+json'}});
    if(r.status===404)return null;if(!r.ok)throw new Error('GitHub GET error '+r.status);return r.json();
  },
  async put(path,content,sha,isBase64){
    const body={message:'update',content:isBase64?content:btoa(unescape(encodeURIComponent(content))),branch:'main'};
    if(sha)body.sha=sha;
    const r=await fetch(`https://api.github.com/repos/${REPO}/${REPO_NAME}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${ghToken}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json();throw new Error(e.message||'GitHub PUT error')}return r.json();
  }
};

// DB
async function loadDB(){
  try{const f=await GH.get(DATA_PATH);if(f){dbSha=f.sha;db=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,'')))));if(!db.petty_cash)db.petty_cash=[];if(!db.savings)db.savings=[];if(!db.savings_goal)db.savings_goal={target:0,title:'Meta de ahorro'};if(!db.vehicles)db.vehicles=[];}}catch(e){console.error('loadDB',e)}
}
async function saveDB(){
  try{const c=JSON.stringify(db,null,2);const r=await GH.put(DATA_PATH,c,dbSha);dbSha=r.content.sha}catch(e){console.error('saveDB',e);alert('Error guardando. Verifica tu token.')}
}

// Vehicle-scoped data helpers
function vKm(){return db.km.filter(r=>r.vehicle_id===selectedVehicle.id)}
function vDeliveries(){return db.deliveries.filter(r=>r.vehicle_id===selectedVehicle.id)}
function vExpenses(){return db.expenses.filter(r=>r.vehicle_id===selectedVehicle.id)}
function vPettyCash(){return db.petty_cash.filter(r=>r.vehicle_id===selectedVehicle.id)}
function vNotes(){return db.notes.filter(r=>r.vehicle_id===selectedVehicle.id)}
function vSavings(){return db.savings.filter(r=>r.vehicle_id===selectedVehicle.id)}
function vSavingsGoal(){return selectedVehicle.savings_goal||db.savings_goal||{target:0,title:'Meta de ahorro'}}

// Auth
async function handleLogin(e){e.preventDefault();const n=document.getElementById('login-nombre').value.trim(),cl=document.getElementById('login-clave').value,err=document.getElementById('login-error');err.classList.add('hidden');await loadDB();const u=db.users.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!u||u.password!==cl){err.textContent='Nombre o clave incorrectos';err.classList.remove('hidden');return}currentUser=u;localStorage.setItem('current_user',JSON.stringify(u));showVehicleSelect()}
function logout(){currentUser=null;selectedVehicle=null;localStorage.removeItem('current_user');localStorage.removeItem('selected_vehicle');document.getElementById('app-screen').classList.add('hidden');document.getElementById('vehicle-screen').classList.add('hidden');document.getElementById('login-screen').classList.remove('hidden')}
function saveToken(){const t=document.getElementById('setup-token').value.trim();if(!t.startsWith('github_pat_')&&!t.startsWith('ghp_')){document.getElementById('token-error').textContent='Token debe empezar con ghp_ o github_pat_';document.getElementById('token-error').classList.remove('hidden');return}ghToken=t;localStorage.setItem('gh_token',t);document.getElementById('token-screen').classList.add('hidden');init()}

// Vehicle Select Screen
function showVehicleSelect(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('vehicle-screen').classList.remove('hidden');
  document.getElementById('vehicle-user-info').textContent=`${currentUser.name} - ${currentUser.role==='superadmin'?'SuperAdmin':currentUser.role==='admin'?'Admin':'Conductor'}`;
  renderVehicleList();
}

function renderVehicleList(){
  const list=document.getElementById('vehicle-list');
  let html='';
  if(db.vehicles.length===0){
    html='<div class="card"><p class="text-sm" style="text-align:center;color:#999">No hay vehiculos registrados.</p></div>';
  } else {
    html=db.vehicles.map(v=>`<div class="vehicle-card" onclick="selectVehicle('${v.id}')">
<div class="patente">🚗 ${v.patente}</div>
${v.marca_modelo?`<div class="text-xs" style="margin-top:2px;color:#6C3FE0;font-weight:600">${v.marca_modelo}</div>`:''}
<div class="conductor">👤 ${v.conductor}</div>
${v.descripcion?`<div class="text-xs" style="margin-top:4px">${v.descripcion}</div>`:''}
</div>`).join('');
  }
  if(isSuperAdmin()){
    html+=`<div class="card" style="margin-top:16px">
<h3 class="text-sm mb-2" style="font-weight:700">➕ Agregar vehiculo</h3>
<label>Patente</label><input type="text" id="veh-patente" placeholder="Ej: AB123CD" style="text-transform:uppercase">
<label>Marca y modelo</label><input type="text" id="veh-marca" placeholder="Ej: Fiat Cronos">
<label>Conductor</label><input type="text" id="veh-conductor" placeholder="Nombre del conductor">
<label>Descripcion (opcional)</label><input type="text" id="veh-desc" placeholder="Color, año, etc.">
<button class="btn" onclick="addVehicle()">Agregar vehiculo</button>
</div>`;
  }
  list.innerHTML=html;
}

async function addVehicle(){
  const patente=document.getElementById('veh-patente').value.trim().toUpperCase();
  const marca_modelo=document.getElementById('veh-marca').value.trim();
  const conductor=document.getElementById('veh-conductor').value.trim();
  const descripcion=document.getElementById('veh-desc').value.trim();
  if(!patente||!conductor)return alert('Completa patente y conductor');
  if(db.vehicles.find(v=>v.patente===patente))return alert('Ya existe un vehiculo con esa patente');
  db.vehicles.push({id:uid(),patente,marca_modelo:marca_modelo||null,conductor,descripcion:descripcion||null,savings_goal:{target:0,title:'Meta de ahorro'}});
  await saveDB();
  renderVehicleList();
}

async function deleteVehicle(id){
  if(!isSuperAdmin())return;
  const code=prompt('Codigo para eliminar vehiculo:');
  if(code!=='001')return alert('Codigo incorrecto');
  const v=db.vehicles.find(x=>x.id===id);
  if(!v)return;
  if(!confirm(`¿Eliminar vehiculo ${v.patente} y TODOS sus datos?`))return;
  db.vehicles=db.vehicles.filter(x=>x.id!==id);
  db.km=db.km.filter(x=>x.vehicle_id!==id);
  db.deliveries=db.deliveries.filter(x=>x.vehicle_id!==id);
  db.expenses=db.expenses.filter(x=>x.vehicle_id!==id);
  db.petty_cash=db.petty_cash.filter(x=>x.vehicle_id!==id);
  db.notes=db.notes.filter(x=>x.vehicle_id!==id);
  db.savings=db.savings.filter(x=>x.vehicle_id!==id);
  await saveDB();
  renderVehicleList();
}

function selectVehicle(id){
  const v=db.vehicles.find(x=>x.id===id);
  if(!v)return;
  selectedVehicle=v;
  localStorage.setItem('selected_vehicle',JSON.stringify(v));
  showApp();
}

function goToVehicleSelect(){
  selectedVehicle=null;
  localStorage.removeItem('selected_vehicle');
  document.getElementById('app-screen').classList.add('hidden');
  showVehicleSelect();
}

// Nav
function buildNav(){
  const items=[{id:'inicio',i:'📊',l:'Inicio'},{id:'km',i:'🛣️',l:'Km'},{id:'entregas',i:'💰',l:'Entregas'},{id:'gastos',i:'💸',l:'Gastos'},{id:'caja',i:'📦',l:'Caja'},{id:'ahorro',i:'🐷',l:'Ahorro'},{id:'infracciones',i:'🚨',l:'Multas'},{id:'backup',i:'💾',l:'Backup'},{id:'notas',i:'📝',l:'Notas'}];
  if(isSuperAdmin()){items.push({id:'vehiculos',i:'🚗',l:'Vehiculos'});items.push({id:'usuarios',i:'👥',l:'Usuarios'});}
  document.getElementById('main-nav').innerHTML=items.map(x=>`<a href="#" onclick="nav('${x.id}')" id="nav-${x.id}" class="${x.id===currentPage?'active':''}"><span class="icon">${x.i}</span>${x.l}</a>`).join('');
}
function nav(p){document.querySelectorAll('[id^="page-"]').forEach(el=>el.classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('#main-nav a').forEach(a=>a.classList.remove('active'));const el=document.getElementById('nav-'+p);if(el)el.classList.add('active');currentPage=p;render(p)}

// Helpers
function isSuperAdmin(){return currentUser&&currentUser.role==='superadmin'}
function fmt(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n)}
function today(){return new Date().toISOString().split('T')[0]}
function weekRange(){const now=new Date(),day=now.getDay(),diff=day===0?6:day-1,s=new Date(now);s.setDate(now.getDate()-diff);const e=new Date(s);e.setDate(s.getDate()+6);return{from:s.toISOString().split('T')[0],to:e.toISOString().split('T')[0]}}
function weekRangeFor(dateStr){const d=new Date(dateStr+'T12:00:00'),day=d.getDay(),diff=day===0?6:day-1,s=new Date(d);s.setDate(d.getDate()-diff);const e=new Date(s);e.setDate(s.getDate()+6);return{from:s.toISOString().split('T')[0],to:e.toISOString().split('T')[0]}}
function monthRange(){const now=new Date(),s=new Date(now.getFullYear(),now.getMonth(),1),e=new Date(now.getFullYear(),now.getMonth()+1,0);return{from:s.toISOString().split('T')[0],to:e.toISOString().split('T')[0]}}
function inR(d,f,t){return d>=f&&d<=t}
function uid(){return Date.now()+''+Math.random().toString(36).substr(2,5)}

function render(p){switch(p){case'inicio':rDash();break;case'km':rKm();break;case'entregas':rEnt();break;case'gastos':rGas();break;case'caja':rCaja();break;case'ahorro':rAhorro();break;case'infracciones':rInfracciones();break;case'usuarios':rUsuarios();break;case'vehiculos':rVehiculos();break;case'backup':rBackup();break;case'notas':rNotas();break}}

const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function groupByMonth(recs,dateField){
  const groups={};
  recs.forEach(r=>{const d=(r[dateField]||'').substring(0,7);if(!d)return;if(!groups[d])groups[d]=[];groups[d].push(r)});
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([key,items])=>{
    const[y,m]=key.split('-');return{key,label:`${MESES[parseInt(m)-1]} ${y}`,items}});
}
function accordion(groups,renderItem,totalFn){
  if(groups.length===0)return'<p class="text-xs">Sin registros</p>';
  return groups.map((g,i)=>{const total=totalFn?totalFn(g.items):'';return`<div style="border:1px solid #eee;border-radius:10px;margin-bottom:8px;overflow:hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('.arrow').classList.toggle('open')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fafafa;border:none;cursor:pointer"><span style="font-weight:700;font-size:.85rem">${g.label}</span><span style="display:flex;align-items:center;gap:8px"><span class="text-xs" style="color:#6C3FE0;font-weight:600">${total}</span><span class="arrow${i===0?' open':''}" style="font-size:.7rem;transition:transform .2s;${i===0?'transform:rotate(90deg)':''}">▶</span></span></button><div class="${i===0?'':'hidden'}" style="padding:8px 12px">${g.items.map(renderItem).join('')}</div></div>`}).join('')}


// USUARIOS (solo superadmin)
function rUsuarios(){
  if(!isSuperAdmin()){document.getElementById('page-usuarios').innerHTML='<p>Sin acceso</p>';return}
  const roles=[{v:'superadmin',l:'SuperAdmin'},{v:'admin',l:'Admin / Dueno'},{v:'conductor',l:'Conductor'}];
  document.getElementById('page-usuarios').innerHTML=`<h2 class="section-title">👥 Gestion de Usuarios</h2>
<div class="card"><h3 class="text-sm mb-2" style="font-weight:700">Crear usuario</h3>
<form onsubmit="crearUsuario(event)">
<label>Nombre</label><input type="text" id="usr-nombre" required placeholder="Nombre del usuario">
<label>Clave</label><input type="text" id="usr-clave" required placeholder="Clave de acceso">
<label>Rol</label><select id="usr-rol">${roles.map(r=>`<option value="${r.v}">${r.l}</option>`).join('')}</select>
<button class="btn" type="submit">Crear usuario</button>
<div id="usr-msg"></div>
</form></div>

// GANANCIA MENSUAL
function buildMonthlyGanancia(){
  const dels=vDeliveries();
  const exps=vExpenses();
  const pc=vPettyCash();
  const meses={};
  dels.forEach(d=>{
    const m=d.week_start.substring(0,7);
    if(!meses[m]) meses[m]={ingreso:0,gastos:0,caja:0,entregas:0};
    meses[m].ingreso+=(d.amount_paid||0);
    meses[m].entregas++;
  });
  exps.forEach(e=>{
    const m=e.date.substring(0,7);
    if(!meses[m]) meses[m]={ingreso:0,gastos:0,caja:0,entregas:0};
    meses[m].gastos+=e.amount;
  });
  pc.filter(p=>p.type==='ingreso').forEach(p=>{
    const m=(p.date||p.week_start||'').substring(0,7);
    if(!m)return;
    if(!meses[m]) meses[m]={ingreso:0,gastos:0,caja:0,entregas:0};
    meses[m].caja+=p.amount;
  });
  const sorted=Object.keys(meses).sort((a,b)=>b.localeCompare(a));
  if(sorted.length===0) return '';
  const nombres=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const ESPERADO=RENTA*4;
  const rows=sorted.map(m=>{
    const d=meses[m];
    const ganancia=d.ingreso-d.gastos-d.caja;
    const mesNum=parseInt(m.split('-')[1])-1;
    const anio=m.split('-')[0];
    const cumple=d.ingreso>=ESPERADO;
    return`<div class="list-item"><div class="flex-between"><div><strong class="text-sm">${nombres[mesNum]} ${anio}</strong><br><span class="text-xs">${d.entregas} entregas - Ingreso: ${fmt(d.ingreso)}</span></div><div style="text-align:right"><span style="font-weight:700" class="${ganancia>=0?'text-success':'text-danger'}">${fmt(ganancia)}</span><br><span class="badge badge-${cumple?'green':'yellow'}">${cumple?'cumple':'parcial'}</span></div></div></div>`;
  }).join('');
  return`<div class="card"><h3 class="text-sm mb-2" style="font-weight:700;color:#555">📅 Ganancia por mes</h3>${rows}</div>`;
}

async function delEnt(id){const code=prompt('Codigo para eliminar:');if(code!=='001')return alert('Codigo incorrecto');db.deliveries=db.deliveries.filter(x=>x.id!==id);await saveDB();rEnt()}
async function editEnt(id){
  const code=prompt('Codigo para editar:');
  if(code!=='001') return alert('Codigo incorrecto');

// Devuelve la lista de recibos de una entrega (compatible con el campo viejo recibo_url)
function reciboList(d){return (d.recibo_urls&&d.recibo_urls.length)?d.recibo_urls:(d.recibo_url?[d.recibo_url]:[]);}
// Normaliza a recibo_urls (array) y elimina el campo viejo recibo_url
function ensureRecibos(d){if(!Array.isArray(d.recibo_urls))d.recibo_urls=d.recibo_url?[d.recibo_url]:[];if('recibo_url'in d)delete d.recibo_url;return d.recibo_urls;}

async function subirRecibo(id,input){
  if(!input.files||!input.files.length)return;
  const d=db.deliveries.find(x=>x.id===id);if(!d)return;
  const arr=ensureRecibos(d);
  const files=[...input.files];
  let subidos=0;
  for(const file of files){
    if(file.size>10*1024*1024){alert('Archivo muy grande (max 10MB): '+file.name);continue}
    try{
      const base64=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result.replace(/^data:[^;]+;base64,/,''));rd.onerror=rej;rd.readAsDataURL(file)});
      const ext=file.name.split('.').pop().toLowerCase();
      const filename=`data/recibos/recibo-${d.week_end}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const r=await GH.put(filename,base64,null,true);
      arr.push(r.content.download_url);
      subidos++;
    }catch(e){alert('Error subiendo recibo ('+file.name+'): '+e.message)}
  }
  input.value='';
  if(subidos){await saveDB();rEnt()}
}

async function delRecibo(id,idx){
  if(!confirm('¿Eliminar este recibo?'))return;
  const d=db.deliveries.find(x=>x.id===id);if(!d)return;
  const arr=ensureRecibos(d);
  if(idx>=0&&idx<arr.length)arr.splice(idx,1);
  await saveDB();
  rEnt();
}

// BACKUP
function rBackup(){document.getElementById('page-backup').innerHTML=`<h2 class="section-title">💾 Backup de Datos</h2>
<p class="text-xs mb-3">Descarga o restaura todos los datos de la aplicacion.</p>
<div class="backup-btn" onclick="downloadBackup()"><div class="icon">⬇️</div><div><div class="text">Descargar backup</div><div class="desc">Guarda un archivo JSON con todos los datos actuales</div></div></div>
<div class="backup-btn" onclick="document.getElementById('restore-input').click()"><div class="icon">⬆️</div><div><div class="text">Restaurar backup</div><div class="desc">Carga un archivo JSON previamente descargado</div></div></div>
<div class="card mt-2" style="background:#fffbeb;border-color:#fde68a"><p class="text-xs" style="color:#92400e">⚠️ Restaurar reemplaza TODOS los datos actuales con los del archivo.</p></div>`}
async function downloadBackup(){
  const backupData=JSON.parse(JSON.stringify(db));
  const recibos={};
  for(const d of backupData.deliveries||[]){
    const urls=reciboList(d);
    if(!urls.length)continue;
    recibos[d.id]=[];
    for(const u of urls){
      try{
        const r=await fetch(u);
        if(r.ok){
          const blob=await r.blob();
          const b64=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(blob)});
          recibos[d.id].push(b64);
        }
      }catch(e){console.error('No se pudo incluir recibo:',d.id,e)}
    }
  }
  backupData._recibos_base64=recibos;
  const blob=new Blob([JSON.stringify(backupData,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='auto-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url)
}
async function restoreDB(e){const file=e.target.files[0];if(!file)return;if(!confirm('¿Restaurar? Esto reemplaza TODOS los datos actuales.'))return;const text=await file.text();try{const parsed=JSON.parse(text);
if(parsed.version&&parsed.entregas){
  db.km=(parsed.km||[]).map((r,i)=>({id:'k'+i,date:r.fecha,km_start:r.km_inicio,km_end:r.km_fin,notes:r.notas,user:r.usuario}));
  db.deliveries=(parsed.entregas||[]).map((r,i)=>({id:'d'+i,week_start:r.semana_inicio,week_end:r.semana_fin,km_total:r.km_total,amount_paid:r.monto_pagado,notes:r.notas,user:r.usuario}));
  db.expenses=(parsed.gastos||[]).map((r,i)=>({id:'e'+i,category:r.categoria,amount:r.monto,date:r.fecha,description:r.descripcion}));
  db.notes=(parsed.notas||[]).map((r,i)=>({id:'n'+i,author:r.usuario||'',content:r.contenido||r.texto||'',created_at:r.timestamp||''}));
  if(!db.petty_cash)db.petty_cash=[];if(!db.savings)db.savings=[];if(!db.savings_goal)db.savings_goal={target:0,title:'Meta de ahorro'};if(!db.vehicles)db.vehicles=[];
} else if(parsed.users){
  db=parsed;if(!db.petty_cash)db.petty_cash=[];if(!db.savings)db.savings=[];if(!db.savings_goal)db.savings_goal={target:0,title:'Meta de ahorro'};if(!db.vehicles)db.vehicles=[];
} else {throw new Error('Formato no reconocido')}
if(parsed._recibos_base64){
  for(const[id,val]of Object.entries(parsed._recibos_base64)){
    const d=db.deliveries.find(x=>x.id===id);
    if(!d||!val)continue;
    const lista=Array.isArray(val)?val:[val];
    const nuevas=[];
    for(const b64 of lista){
      if(!b64)continue;
      try{
        const base64Clean=b64.replace(/^data:[^;]+;base64,/,'');
        const ext=b64.match(/^data:image\/(\w+)/)?.[1]||'png';
        const filename=`data/recibos/recibo-${d.week_end}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
        const r=await GH.put(filename,base64Clean,null,true);
        nuevas.push(r.content.download_url);
      }catch(err){console.error('Error restaurando recibo:',id,err)}
    }
    d.recibo_urls=nuevas;
    if('recibo_url'in d)delete d.recibo_url;
  }
  delete db._recibos_base64;
}
await saveDB();alert('Datos restaurados correctamente.');rBackup()}catch(err){alert('Error: archivo invalido. '+err.message)}e.target.value=''}
